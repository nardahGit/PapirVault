<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Verification | PapirVault</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../Styles/fonts.css">
    <link rel="stylesheet" href="../Styles/themes.css">
    <link rel="stylesheet" href="../Styles/style.css">
    <link rel="stylesheet" href="../Styles/animations.css">
</head>
<body class="dashboard-body">
    <main class="container py-5" style="max-width: 760px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold mb-1">PapirVault Verification</h3>
            <p class="text-muted small mb-2">Verify receipt/document validity using verification code</p>
            <span id="statusChip" class="badge rounded-pill px-3 py-2 bg-secondary-subtle text-secondary">
                <i class="bi bi-patch-check me-1"></i>Checking status
            </span>
        </div>

        <div class="card border-0 shadow-sm rounded-4 p-3 p-md-4 mb-3">
            <form id="verifyCodeForm" class="row g-2 align-items-end">
                <div class="col-md-8">
                    <label for="verifyCodeInput" class="form-label small fw-bold mb-1">Verification Code</label>
                    <input id="verifyCodeInput" type="text" class="form-control" placeholder="e.g. INS-2026-K7P4V9" autocomplete="off" required>
                </div>
                <div class="col-md-4 d-grid">
                    <button id="verifyCodeBtn" type="submit" class="btn btn-primary rounded-3">
                        <i class="bi bi-search me-1"></i>Verify Code
                    </button>
                </div>
            </form>
            <div id="verifyCodeHint" class="extra-small text-muted mt-2">Paste only the verification code from the receipt.</div>
        </div>

        <div id="verifyCard" class="card border-0 shadow-sm rounded-4 p-4">
            <div id="verifyState" class="d-flex align-items-center gap-3 mb-3">
                <div id="verifyIcon" class="p-3 rounded-3 bg-light text-dark"><i class="bi bi-shield-check fs-4"></i></div>
                <div>
                    <h5 class="fw-bold mb-0" id="verifyTitle">Checking document...</h5>
                    <p class="text-muted small mb-0" id="verifySubtitle">Please wait</p>
                </div>
            </div>

            <div class="bg-light rounded-4 px-3 py-2 d-flex align-items-center justify-content-between mb-3">
                <div class="small text-muted"><i class="bi bi-qr-code-scan me-1"></i>Scanned from verification QR</div>
                <div class="small fw-semibold"><i class="bi bi-shield-lock me-1"></i>Secure Check</div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-md-6">
                    <div class="border rounded-3 p-3 h-100">
                        <div class="text-muted extra-small">Document</div>
                        <div class="fw-semibold" id="docName">-</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded-3 p-3 h-100">
                        <div class="text-muted extra-small">Verification Code</div>
                        <div class="fw-semibold" id="docCode">-</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded-3 p-3 h-100">
                        <div class="text-muted extra-small">Issuer</div>
                        <div class="fw-semibold" id="docIssuer">-</div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="border rounded-3 p-3 h-100">
                        <div class="text-muted extra-small">Valid Until</div>
                        <div class="fw-semibold" id="docValidUntil">-</div>
                    </div>
                </div>
            </div>

            <div id="verifyMessage" class="alert rounded-3 mt-4 mb-0" role="alert"></div>
        </div>
    </main>

    <script src="../Main/firebase-env.js"></script>
    <script type="module">
        import "../Main/firebase-documents.js";

        document.addEventListener("DOMContentLoaded", () => {
            const params = new URLSearchParams(window.location.search);
            const verifyTitle = document.getElementById("verifyTitle");
            const verifySubtitle = document.getElementById("verifySubtitle");
            const verifyIcon = document.getElementById("verifyIcon");
            const verifyMessage = document.getElementById("verifyMessage");
            const statusChip = document.getElementById("statusChip");
            const docName = document.getElementById("docName");
            const docIssuer = document.getElementById("docIssuer");
            const docValidUntil = document.getElementById("docValidUntil");
            const docCode = document.getElementById("docCode");
            const verifyCodeForm = document.getElementById("verifyCodeForm");
            const verifyCodeInput = document.getElementById("verifyCodeInput");
            const verifyCodeBtn = document.getElementById("verifyCodeBtn");

            const setVisualState = ({
                title,
                subtitle,
                iconClass,
                iconHtml,
                messageClass,
                messageHtml,
                chipClass,
                chipHtml
            }) => {
                verifyTitle.textContent = title;
                verifySubtitle.textContent = subtitle;
                verifyIcon.className = iconClass;
                verifyIcon.innerHTML = iconHtml;
                verifyMessage.className = messageClass;
                verifyMessage.innerHTML = messageHtml;
                statusChip.className = chipClass;
                statusChip.innerHTML = chipHtml;
            };

            const setDocumentFields = ({ title, issuer, validUntil, code }) => {
                docName.textContent = title || "-";
                docIssuer.textContent = issuer || "-";
                docValidUntil.textContent = validUntil || "-";
                docCode.textContent = code || "-";
            };

            const normalizeCode = (value) => String(value || "").trim().toUpperCase();

            const applyStatusForRecord = (record) => {
                const status = String(record?.status || "").trim().toLowerCase();
                const title = record?.title || record?.category || "Unknown document";
                const issuer = record?.issuerName || "Unknown issuer";
                const orgType = record?.organizationType ? String(record.organizationType).trim() : "";
                const issuerDisplay = orgType ? `${issuer} (${orgType})` : issuer;
                const validUntil = record?.expiryDate || "N/A";
                const code = record?.verificationCode || "N/A";

                setDocumentFields({ title, issuer: issuerDisplay, validUntil, code });

                if (status === "verified") {
                    setVisualState({
                        title: "Document Verified",
                        subtitle: "Authenticity confirmed from PapirVault records",
                        iconClass: "p-3 rounded-3 bg-success-subtle text-success",
                        iconHtml: '<i class="bi bi-shield-check fs-4"></i>',
                        messageClass: "alert alert-success rounded-3 mt-4 mb-0",
                        messageHtml: `<strong>${title}</strong> is verified by <strong>${issuerDisplay}</strong> and is valid until <strong>${validUntil}</strong>.`,
                        chipClass: "badge rounded-pill px-3 py-2 bg-success-subtle text-success",
                        chipHtml: '<i class="bi bi-patch-check me-1"></i>Verified'
                    });
                    return;
                }

                if (status === "expired") {
                    setVisualState({
                        title: "Document Expired",
                        subtitle: "Record found, but validity period has ended",
                        iconClass: "p-3 rounded-3 bg-danger-subtle text-danger",
                        iconHtml: '<i class="bi bi-x-octagon fs-4"></i>',
                        messageClass: "alert alert-danger rounded-3 mt-4 mb-0",
                        messageHtml: `<strong>${title}</strong> has expired and cannot be accepted as valid. Please request an updated document from <strong>${issuerDisplay}</strong>.`,
                        chipClass: "badge rounded-pill px-3 py-2 bg-danger-subtle text-danger",
                        chipHtml: '<i class="bi bi-x-octagon me-1"></i>Expired'
                    });
                    return;
                }

                if (status === "rejected") {
                    setVisualState({
                        title: "Document Rejected",
                        subtitle: "Record found, but marked as rejected",
                        iconClass: "p-3 rounded-3 bg-danger-subtle text-danger",
                        iconHtml: '<i class="bi bi-slash-circle fs-4"></i>',
                        messageClass: "alert alert-danger rounded-3 mt-4 mb-0",
                        messageHtml: `<strong>${title}</strong> is marked as rejected. Please contact <strong>${issuerDisplay}</strong> for clarification.`,
                        chipClass: "badge rounded-pill px-3 py-2 bg-danger-subtle text-danger",
                        chipHtml: '<i class="bi bi-slash-circle me-1"></i>Rejected'
                    });
                    return;
                }

                setVisualState({
                    title: "Needs Manual Review",
                    subtitle: "Record found, but status requires issuer confirmation",
                    iconClass: "p-3 rounded-3 bg-warning-subtle text-warning",
                    iconHtml: '<i class="bi bi-exclamation-triangle fs-4"></i>',
                    messageClass: "alert alert-warning rounded-3 mt-4 mb-0",
                    messageHtml: `<strong>${title}</strong> is currently marked as <strong>${status || "unverified"}</strong>. Please confirm with <strong>${issuerDisplay}</strong>.`,
                    chipClass: "badge rounded-pill px-3 py-2 bg-warning-subtle text-warning",
                    chipHtml: '<i class="bi bi-exclamation-triangle me-1"></i>Needs Review'
                });
            };

            const verifyByCode = async (codeInput) => {
                const code = normalizeCode(codeInput);
                if (!code) {
                    setVisualState({
                        title: "Verification code required",
                        subtitle: "Enter a code to continue",
                        iconClass: "p-3 rounded-3 bg-secondary-subtle text-secondary",
                        iconHtml: '<i class="bi bi-search fs-4"></i>',
                        messageClass: "alert alert-secondary rounded-3 mt-4 mb-0",
                        messageHtml: "Paste the verification code from your receipt and click Verify Code.",
                        chipClass: "badge rounded-pill px-3 py-2 bg-secondary-subtle text-secondary",
                        chipHtml: '<i class="bi bi-search me-1"></i>Waiting Input'
                    });
                    return;
                }

                verifyCodeBtn.disabled = true;
                verifyCodeBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span>Checking';

                setVisualState({
                    title: "Checking document...",
                    subtitle: "Searching verification records",
                    iconClass: "p-3 rounded-3 bg-secondary-subtle text-secondary",
                    iconHtml: '<i class="bi bi-hourglass-split fs-4"></i>',
                    messageClass: "alert alert-secondary rounded-3 mt-4 mb-0",
                    messageHtml: `Checking code <strong>${code}</strong> against PapirVault records...`,
                    chipClass: "badge rounded-pill px-3 py-2 bg-secondary-subtle text-secondary",
                    chipHtml: '<i class="bi bi-hourglass-split me-1"></i>Checking'
                });

                try {
                    if (!window.PapirVaultDocs?.isReady?.()) {
                        throw new Error("Verification service is not configured.");
                    }

                    const record = await window.PapirVaultDocs.getDocumentByVerificationCode({ verificationCode: code });

                    if (!record) {
                        setDocumentFields({ title: "-", issuer: "-", validUntil: "-", code });
                        setVisualState({
                            title: "Record Not Found",
                            subtitle: "No matching code in verified records",
                            iconClass: "p-3 rounded-3 bg-danger-subtle text-danger",
                            iconHtml: '<i class="bi bi-x-circle fs-4"></i>',
                            messageClass: "alert alert-danger rounded-3 mt-4 mb-0",
                            messageHtml: `No document found for verification code <strong>${code}</strong>. Please confirm the code and issuer source.`,
                            chipClass: "badge rounded-pill px-3 py-2 bg-danger-subtle text-danger",
                            chipHtml: '<i class="bi bi-x-circle me-1"></i>Not Found'
                        });
                        return;
                    }

                    applyStatusForRecord(record);
                } catch (error) {
                    setVisualState({
                        title: "Verification Failed",
                        subtitle: "Unable to check this code right now",
                        iconClass: "p-3 rounded-3 bg-danger-subtle text-danger",
                        iconHtml: '<i class="bi bi-exclamation-octagon fs-4"></i>',
                        messageClass: "alert alert-danger rounded-3 mt-4 mb-0",
                        messageHtml: error?.message || "Verification service unavailable. Try again shortly.",
                        chipClass: "badge rounded-pill px-3 py-2 bg-danger-subtle text-danger",
                        chipHtml: '<i class="bi bi-exclamation-octagon me-1"></i>Error'
                    });
                } finally {
                    verifyCodeBtn.disabled = false;
                    verifyCodeBtn.innerHTML = '<i class="bi bi-search me-1"></i>Verify Code';
                }
            };

            verifyCodeForm?.addEventListener("submit", async (event) => {
                event.preventDefault();
                await verifyByCode(verifyCodeInput.value);
            });

            const codeFromUrl = normalizeCode(params.get("code") || "");
            if (codeFromUrl) {
                verifyCodeInput.value = codeFromUrl;
                verifyByCode(codeFromUrl);
                return;
            }

            // Fallback mode for legacy links without verification-code lookup.
            const legacyStatus = normalizeCode(params.get("status") || "").toLowerCase();
            if (params.has("doc") || params.has("status")) {
                // Compute status from expiry and issue date if present
                const title = params.get("doc") || "Unknown document";
                const issuer = params.get("issuer") || "Unknown issuer";
                const validUntil = params.get("validUntil") || "Unknown";
                const code = params.get("code") || "N/A";
                setDocumentFields({ title, issuer, validUntil, code });

                // Parse dates for 180-day logic
                const expiryDate = validUntil !== "Unknown" ? new Date(validUntil) : null;
                const issueDateParam = params.get("issueDate") || null;
                const issueDate = issueDateParam ? new Date(issueDateParam) : null;
                const today = new Date(); today.setHours(0,0,0,0);
                let status = legacyStatus;
                let statusReason = "";
                if (expiryDate && !isNaN(expiryDate)) {
                    // 180-day rule
                    let maxAllowed = null;
                    if (issueDate && !isNaN(issueDate)) {
                        maxAllowed = new Date(issueDate);
                        maxAllowed.setDate(maxAllowed.getDate() + 180);
                    }
                    if (maxAllowed && expiryDate > maxAllowed) {
                        status = "expired";
                        statusReason = "Expiry exceeds 180-day issuer policy";
                    } else if (expiryDate < today) {
                        status = "expired";
                        statusReason = "Expiry date is in the past";
                    } else if (legacyStatus === "verified") {
                        status = "verified";
                        statusReason = "Within issuer validity policy";
                    } else {
                        status = legacyStatus || "needs review";
                        statusReason = "Manual review required";
                    }
                } else {
                    status = legacyStatus || "needs review";
                    statusReason = "No expiry date provided";
                }

                // Set color and message
                if (status === "verified") {
                    setVisualState({
                        title: "Document Verified",
                        subtitle: "Authenticity confirmed from QR data",
                        iconClass: "p-3 rounded-3 bg-success-subtle text-success",
                        iconHtml: '<i class="bi bi-shield-check fs-4"></i>',
                        messageClass: "alert alert-success rounded-3 mt-4 mb-0",
                        messageHtml: `<strong>${title}</strong> is verified by <strong>${issuer}</strong> and is valid until <strong>${validUntil}</strong>.` + (statusReason ? `<br><span class='small text-muted'>${statusReason}</span>` : ""),
                        chipClass: "badge rounded-pill px-3 py-2 bg-success-subtle text-success",
                        chipHtml: '<i class="bi bi-patch-check me-1"></i>Verified'
                    });
                } else if (status === "expired") {
                    setVisualState({
                        title: "Document Expired",
                        subtitle: "Record found, but validity period has ended",
                        iconClass: "p-3 rounded-3 bg-danger-subtle text-danger",
                        iconHtml: '<i class="bi bi-x-octagon fs-4"></i>',
                        messageClass: "alert alert-danger rounded-3 mt-4 mb-0",
                        messageHtml: `<strong>${title}</strong> has expired and cannot be accepted as valid. Please request an updated document from <strong>${issuer}</strong>.` + (statusReason ? `<br><span class='small text-muted'>${statusReason}</span>` : ""),
                        chipClass: "badge rounded-pill px-3 py-2 bg-danger-subtle text-danger",
                        chipHtml: '<i class="bi bi-x-octagon me-1"></i>Expired'
                    });
                } else {
                    setVisualState({
                        title: "Needs Manual Review",
                        subtitle: "Record found, but status requires issuer confirmation",
                        iconClass: "p-3 rounded-3 bg-warning-subtle text-warning",
                        iconHtml: '<i class="bi bi-exclamation-triangle fs-4"></i>',
                        messageClass: "alert alert-warning rounded-3 mt-4 mb-0",
                        messageHtml: `<strong>${title}</strong> is currently marked as <strong>${status || "unverified"}</strong>. Please confirm with <strong>${issuer}</strong>.` + (statusReason ? `<br><span class='small text-muted'>${statusReason}</span>` : ""),
                        chipClass: "badge rounded-pill px-3 py-2 bg-warning-subtle text-warning",
                        chipHtml: '<i class="bi bi-exclamation-triangle me-1"></i>Needs Review'
                    });
                }
                return;
            }

            setVisualState({
                title: "Ready to Verify",
                subtitle: "Enter a verification code to start",
                iconClass: "p-3 rounded-3 bg-secondary-subtle text-secondary",
                iconHtml: '<i class="bi bi-search fs-4"></i>',
                messageClass: "alert alert-secondary rounded-3 mt-4 mb-0",
                messageHtml: "Paste the verification code from a receipt and click Verify Code.",
                chipClass: "badge rounded-pill px-3 py-2 bg-secondary-subtle text-secondary",
                chipHtml: '<i class="bi bi-search me-1"></i>Ready'
            });
        });
    </script>
    <script src="../Main/animations.js"></script>
</body>
</html>
